<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodas de Lino - 4.º Aniversario</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f4f6f8;
      background-image: radial-gradient(#d0d7de 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      border: 1px solid #eef2f5;
    }
    .flower-icon { font-size: 32px; margin-bottom: 8px; }
    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7f8c8d;
      font-weight: 500;
      margin-bottom: 6px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #1a252f;
      margin-bottom: 4px;
    }
    .date-display {
      font-size: 13px;
      color: #95a5a6;
      margin-bottom: 24px;
      font-style: italic;
    }
    .img-container {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      background: #f8f9fa;
      margin-bottom: 24px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }
    .msg-box {
      background: #f8fafc;
      border-left: 3px solid #4a6fa5;
      padding: 18px 20px;
      border-radius: 0 12px 12px 0;
      text-align: left;
      margin-bottom: 28px;
    }
    .msg-box p {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #34495e;
      font-style: italic;
    }
    .footer {
      font-size: 12px;
      color: #bdc3c7;
    }
    .footer span { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="flower-icon">🪻</div>
    <div class="subtitle">Bodas de Lino & Flores</div>
    <h1>4.º Aniversario</h1>
    <div class="date-display" id="date-title">27 de agosto</div>

    <div class="img-container">
      <img id="daily-img" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600" alt="Foto">
    </div>

    <div class="msg-box">
      <p id="daily-msg">FELIZ CUARTO ANIVERSARIO</p>
    </div>

    <div class="footer">
      Hecho con <span>♥</span> para ti
    </div>
  </div>

  <script>
    const SHEET_ID = '1OmDB5G1sZ72b58smMAOcM5jCf9tx_i4GQ134h7qV41I';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    // Función para hacer peticiones con límite de tiempo (Timeout de 8 segundos)
    function fetchConTimeout(url, timeoutMs = 8000) {
      return Promise.race([
        fetch(url),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Tiempo de espera agotado')), timeoutMs)
        )
      ]);
    }

    // Intentar conectar hasta 3 veces si la red falla
    async function obtenerDatosConReintentos(reintentos = 3) {
      for (let i = 0; i < reintentos; i++) {
        try {
          const res = await fetchConTimeout(`${URL}&nocache=${Date.now()}`, 8000);
          if (!res.ok) throw new Error("Error HTTP");
          
          const data = await res.text();
          const json = JSON.parse(data.substring(47, data.length - 2));
          return json.table.rows;
        } catch (err) {
          console.warn(`Intento ${i + 1} fallido. Reintentando...`);
          if (i === reintentos - 1) throw err; // Si se agotan los intentos, lanza error
          await new Promise(r => setTimeout(r, 1000)); // Esperar 1 seg antes del reintento
        }
      }
    }

    async function iniciarCarga() {
      try {
        const filas = await obtenerDatosConReintentos(3);

        if (filas && filas.length > 0) {
          const m = filas[0].c && filas[0].c[1] ? filas[0].c[1].v : null;
          let f = filas[0].c && filas[0].c[2] ? filas[0].c[2].v : null;

          if (m) {
            document.getElementById('daily-msg').innerText = `"${m}"`;
          }

          if (f) {
            if (f.includes("drive.google.com")) {
              const id = f.match(/\/d\/([^\/\?]+)/);
              if (id) f = `https://lh3.googleusercontent.com/d/${id[1]}`;
            }
            document.getElementById('daily-img').src = f;
          }
        }
      } catch (e) {
        console.log("No se pudo conectar a Google Sheets a tiempo. Mostrando respaldo local.");
        // Mantiene la frase "FELIZ CUARTO ANIVERSARIO" para que nunca quede vacía
      }
    }

    iniciarCarga();
  </script>
</body>
</html>
