<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodas de Lino - 4.º Aniversario</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f4f6f8;
      background-image: radial-gradient(#d0d7de 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      border: 1px solid #eef2f5;
    }
    .flower-icon { font-size: 32px; margin-bottom: 8px; }
    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7f8c8d;
      font-weight: 500;
      margin-bottom: 6px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #1a252f;
      margin-bottom: 4px;
    }
    .date-display {
      font-size: 13px;
      color: #95a5a6;
      margin-bottom: 24px;
      font-style: italic;
    }
    .img-container {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      background: #f8f9fa;
      margin-bottom: 24px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .msg-box {
      background: #f8fafc;
      border-left: 3px solid #4a6fa5;
      padding: 18px 20px;
      border-radius: 0 12px 12px 0;
      text-align: left;
      margin-bottom: 28px;
    }
    .msg-box p {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #34495e;
      font-style: italic;
    }
    .footer {
      font-size: 12px;
      color: #bdc3c7;
    }
    .footer span { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="flower-icon">🪻</div>
    <div class="subtitle">Bodas de Lino & Flores</div>
    <h1>4.º Aniversario</h1>
    <div class="date-display" id="date-title">Cargando fecha...</div>

    <div class="img-container">
      <img id="daily-img" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600" alt="Foto del día">
    </div>

    <div class="msg-box">
      <p id="daily-msg">Cargando mensaje...</p>
    </div>

    <div class="footer">
      Hecho con <span>♥️</span> para ti
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz-258MAxfAP-9ryBlUbqwAEtNTZpb8qWhR8mA4WRxDJVHIzIbYbQR2FHRWRYZgz6wfU-EhyfBJ9YH/pub?output=csv";

    async function cargarEnTiempoReal() {
      // 1. Poner fecha de hoy bonita en la pantalla
      const hoy = new Date();
      const opcionesFecha = { day: 'numeric', month: 'long' };
      document.getElementById('date-title').innerText = hoy.toLocaleDateString('es-ES', opcionesFecha);

      try {
        // 2. Pedir datos frescos sin guardar en memoria Caché
        const urlTiempoReal = ${CSV_URL}&_t=${Date.now()};
        const res = await fetch(urlTiempoReal);
        const textoCSV = await res.text();

        // 3. Separar por filas y parsear correctamente ignorando comas dentro de comillas
        const lineas = textoCSV.split('\n');
        const filas = lineas.map(l => l.split(/,(?=(?:(?:[^"]"){2})[^"]*$)/));

        // 4. Preparar la búsqueda de hoy
        const diaNum = hoy.getDate().toString(); // "27"
        
        // Buscar fila que coincida con "27" o la fecha de hoy
        let filaHoy = filas.find(f => {
          if (!f[0]) return false;
          const celdaFecha = f[0].replace(/"/g, '').trim();
          return celdaFecha.includes(diaNum) || celdaFecha.includes("2026-08-27") || celdaFecha.includes("27/08");
        });

        // Si no la encuentra, usa la Fila 2 (A2) por seguridad
        if (!filaHoy && filas.length > 1) {
          filaHoy = filas[1];
        }

        // 5. Asignar mensaje y foto si existen
        if (filaHoy) {
          const mensajeRaw = filaHoy[1] ? filaHoy[1].replace(/^"|"$/g, '').trim() : "";
          let fotoRaw = filaHoy[2] ? filaHoy[2].replace(/^"|"$/g, '').trim() : "";

          if (mensajeRaw) {
            document.getElementById('daily-msg').innerText = "${mensajeRaw}";
          }

          if (fotoRaw) {
            // Si es link de Google Drive, convertir a vista previa pública
            if (fotoRaw.includes("drive.google.com")) {
              const match = fotoRaw.match(/\/d\/([^\/\?]+)/) || fotoRaw.match(/id=([^&]+)/);
              if (match && match[1]) {
                fotoRaw = https://lh3.googleusercontent.com/d/${match[1]}=s1000;
              }
            }
            document.getElementById('daily-img').src = fotoRaw;
          }
        }
      } catch (err) {
        console.error("Error al actualizar:", err);
      }
    }

    cargarEnTiempoReal();
  </script>
</body>
</html>
