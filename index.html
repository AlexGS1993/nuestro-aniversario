<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodas de Lino - 4.º Aniversario</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f4f6f8;
      background-image: radial-gradient(#d0d7de 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      border: 1px solid #eef2f5;
    }
    .flower-icon { font-size: 32px; margin-bottom: 8px; }
    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7f8c8d;
      font-weight: 500;
      margin-bottom: 6px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #1a252f;
      margin-bottom: 4px;
    }
    .date-display {
      font-size: 13px;
      color: #95a5a6;
      margin-bottom: 24px;
      font-style: italic;
    }
    .img-container {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      background: #f8f9fa;
      margin-bottom: 24px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .msg-box {
      background: #f8fafc;
      border-left: 3px solid #4a6fa5;
      padding: 18px 20px;
      border-radius: 0 12px 12px 0;
      text-align: left;
      margin-bottom: 28px;
    }
    .msg-box p {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #34495e;
      font-style: italic;
    }
    .footer {
      font-size: 12px;
      color: #bdc3c7;
    }
    .footer span { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="flower-icon">🪻</div>
    <div class="subtitle">Bodas de Lino & Flores</div>
    <h1>4.º Aniversario</h1>
    <div class="date-display">27 de agosto</div>

    <div class="img-container">
      <img id="daily-img" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600" alt="Foto">
    </div>

    <div class="msg-box">
      <p id="daily-msg">Cargando...</p>
    </div>

    <div class="footer">
      Hecho con <span>♥️</span> para ti
    </div>
  </div>

  <script>
    // Tu ID de Google Sheets
    const SHEET_ID = '1OmDB5G1sZ72b58smMAOcM5jCf9tx_i4GQ134h7qV41I';
    const URL = https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;

    fetch(URL)
      .then(res => res.text())
      .then(data => {
        // Limpiar la respuesta JSON de Google
        const json = JSON.parse(data.substring(47, data.length - 2));
        const filas = json.table.rows;

        // Fila 0 en el JSON corresponde a la fila 2 de tu tabla (la primera con datos)
        if (filas.length > 0) {
          const mensaje = filas[0].c[1] ? filas[0].c[1].v : "";
          let fotoUrl = filas[0].c[2] ? filas[0].c[2].v : "";

          if (mensaje) {
            document.getElementById('daily-msg').innerText = "${mensaje}";
          }

          if (fotoUrl) {
            if (fotoUrl.includes("drive.google.com")) {
              const id = fotoUrl.match(/\/d\/([^\/\?]+)/);
              if (id) fotoUrl = https://lh3.googleusercontent.com/d/${id[1]};
            }
            document.getElementById('daily-img').src = fotoUrl;
          }
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('daily-msg').innerText = '"FELIZ CUARTO ANIVERSARIO"';
      });
  </script>
</body>
</html>
