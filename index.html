<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodas de Lino - 4.º Aniversario</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f4f6f8;
      background-image: radial-gradient(#d0d7de 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      border: 1px solid #eef2f5;
    }
    .flower-icon { font-size: 32px; margin-bottom: 8px; }
    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7f8c8d;
      font-weight: 500;
      margin-bottom: 6px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #1a252f;
      margin-bottom: 4px;
    }
    .date-display {
      font-size: 13px;
      color: #95a5a6;
      margin-bottom: 24px;
      font-style: italic;
    }
    .img-container {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      background: #f8f9fa;
      margin-bottom: 24px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }
    .msg-box {
      background: #f8fafc;
      border-left: 3px solid #4a6fa5;
      padding: 18px 20px;
      border-radius: 0 12px 12px 0;
      text-align: left;
      margin-bottom: 28px;
    }
    .msg-box p {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #34495e;
      font-style: italic;
    }
    .footer {
      font-size: 12px;
      color: #bdc3c7;
    }
    .footer span { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="flower-icon">🪻</div>
    <div class="subtitle">Bodas de Lino & Flores</div>
    <h1>4.º Aniversario</h1>
    <div class="date-display" id="date-title">27 de agosto</div>

    <div class="img-container">
      <img id="daily-img" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600" alt="Foto del día">
    </div>

    <div class="msg-box">
      <p id="daily-msg">FELIZ CUARTO ANIVERSARIO</p>
    </div>

    <div class="footer">
      Hecho con <span>♥️</span> para ti
    </div>
  </div>

  <script>
    const SHEET_ID = "1OmDB5G1sZ72b58smMAOcM5jCf9tx_i4GQ134h7qV41I";

    // Parser CSV seguro que maneja comillas y saltos de línea
    function parseCSV(text) {
      const result = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];

        if (c === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push(cell.trim());
          cell = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(cell.trim());
          if (row.some(field => field !== '')) result.push(row);
          row = [];
          cell = '';
        } else {
          cell += c;
        }
      }
      if (cell || row.length > 0) {
        row.push(cell.trim());
        if (row.some(field => field !== '')) result.push(row);
      }
      return result;
    }

    // Convertir URLs de Google Drive a imágenes directas públicas
    function arreglarUrlImagen(url) {
      if (!url) return '';
      let limpia = url.trim();
      if (limpia.includes("drive.google.com")) {
        const match = limpia.match(/\/d\/([^\/\?]+)/) || limpia.match(/id=([^&]+)/);
        if (match && match[1]) {
          return https://lh3.googleusercontent.com/d/${match[1]}=s1000;
        }
      }
      return limpia;
    }

    async function cargarDatos() {
      // Poner fecha de hoy
      const hoy = new Date();
      const opcionesFecha = { day: 'numeric', month: 'long' };
      document.getElementById('date-title').innerText = hoy.toLocaleDateString('es-ES', opcionesFecha);

      // Métodos de conexión ordenados por velocidad y confiabilidad
      const fuentes = [
        https://docs.google.com/spreadsheets/d/e/2PACX-1vSz-258MAxfAP-9ryBlUbqwAEtNTZpb8qWhR8mA4WRxDJVHIzIbYbQR2FHRWRYZgz6wfU-EhyfBJ9YH/pub?output=csv&t=${Date.now()},
        https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${Date.now()},
        https://api.allorigins.win/raw?url= + encodeURIComponent(https://docs.google.com/spreadsheets/d/e/2PACX-1vSz-258MAxfAP-9ryBlUbqwAEtNTZpb8qWhR8mA4WRxDJVHIzIbYbQR2FHRWRYZgz6wfU-EhyfBJ9YH/pub?output=csv&t=${Date.now()})
      ];

      let csvTexto = null;

      for (const url of fuentes) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000); // 4 seg por intento
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const txt = await res.text();
            if (txt && txt.length > 10) {
              csvTexto = txt;
              break;
            }
          }
        } catch (e) {
          console.warn("Falló un método de conexión, intentando el siguiente...");
        }
      }

      if (!csvTexto) {
        console.log("Servidor no respondió a tiempo. Se conserva mensaje por defecto.");
        return;
      }

      try {
        const filas = parseCSV(csvTexto);
        if (filas.length <= 1) return;

        // Formatos de fecha de hoy para buscar en la tabla
        const diaNum = hoy.getDate().toString();
        const mesNum = (hoy.getMonth() + 1).toString().padStart(2, '0');
        const anioNum = hoy.getFullYear().toString();
        
        const stringFecha1 = ${diaNum}/${mesNum}/${anioNum};
        const stringFecha2 = ${anioNum}-${mesNum}-${diaNum.padStart(2, '0')};

        // Buscar la fila correspondiente al día de hoy
        let filaHoy = filas.find((f, index) => {
          if (index === 0) return false; // Ignorar encabezado
          if (!f[0]) return false;
          const fechaCelda = f[0].toLowerCase();
          return fechaCelda.includes(stringFecha1) || 
                 fechaCelda.includes(stringFecha2) || 
                 fechaCelda.startsWith(diaNum) ||
                 fechaCelda.includes("27");
        });

        // Si no la encuentra por fecha, usar la Fila 2 de la tabla
        if (!filaHoy) filaHoy = filas[1];

        if (filaHoy) {
          const mensaje = filaHoy[1] ? filaHoy[1] : '';
          const fotoUrl = filaHoy[2] ? filaHoy[2] : '';

          if (mensaje) {
            document.getElementById('daily-msg').innerText = "${mensaje}";
          }

          if (fotoUrl) {
            const urlFinal = arreglarUrlImagen(fotoUrl);
            if (urlFinal) {
              document.getElementById('daily-img').src = urlFinal;
            }
          }
        }
      } catch (err) {
        console.error("Error al procesar datos:", err);
      }
    }

    cargarDatos();
  </script>
</body>
</html>
