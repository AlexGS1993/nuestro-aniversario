<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodas de Lino - 4.º Aniversario</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f6f8;
      background-image: radial-gradient(#d0d7de 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      border: 1px solid #eef2f5;
    }

    .flower-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7f8c8d;
      font-weight: 500;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #1a252f;
      margin-bottom: 4px;
    }

    .date-display {
      font-size: 13px;
      color: #95a5a6;
      margin-bottom: 24px;
      font-style: italic;
    }

    .img-container {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      background: #f8f9fa;
      margin-bottom: 24px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .msg-box {
      background: #f8fafc;
      border-left: 3px solid #4a6fa5;
      padding: 18px 20px;
      border-radius: 0 12px 12px 0;
      text-align: left;
      margin-bottom: 28px;
    }

    .msg-box p {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #34495e;
      font-style: italic;
    }

    .footer {
      font-size: 12px;
      color: #bdc3c7;
    }

    .footer span {
      color: #e74c3c;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="flower-icon">🪻</div>

    <div class="subtitle">
      Bodas de Lino & Flores
    </div>

    <h1>
      4.º Aniversario
    </h1>

    <div class="date-display" id="date-title">
      27 de agosto
    </div>

    <div class="img-container">
      <img
        id="daily-img"
        src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600"
        alt="Foto del día"
      >
    </div>

    <div class="msg-box">
      <p id="daily-msg">
        FELIZ CUARTO ANIVERSARIO
      </p>
    </div>

    <div class="footer">
      Hecho con <span>♥</span> para ti
    </div>
  </div>


  <script>

    // =========================================================
    // CONFIGURACIÓN
    // =========================================================

    const SHEET_ID = "1OmDB5G1sZ72b58smMAOcM5jCf9tx_i4GQ134h7qV41I";

    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz-258MAxfAP-9ryBlUbqwAEtNTZpb8qWhR8mA4WRxDJVHIzIbYbQR2FHRWRYZgz6wfU-EhyfBJ9YH/pub?output=csv";


    // =========================================================
    // VARIABLES PARA DETECTAR CAMBIOS
    // =========================================================

    let ultimoMensaje = null;
    let ultimaFoto = null;
    let cargando = false;


    // =========================================================
    // PARSER CSV
    // =========================================================

    function parseCSV(text) {

      const result = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {

        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {

          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }

        } else if (c === ',' && !inQuotes) {

          row.push(cell.trim());
          cell = '';

        } else if ((c === '\r' || c === '\n') && !inQuotes) {

          if (c === '\r' && next === '\n') {
            i++;
          }

          row.push(cell.trim());

          if (row.some(field => field !== '')) {
            result.push(row);
          }

          row = [];
          cell = '';

        } else {

          cell += c;
        }
      }

      if (cell || row.length > 0) {

        row.push(cell.trim());

        if (row.some(field => field !== '')) {
          result.push(row);
        }
      }

      return result;
    }


    // =========================================================
    // CONVERTIR URL DE GOOGLE DRIVE
    // =========================================================

    function arreglarUrlImagen(url) {

      if (!url) return '';

      let limpia = url.trim();

      if (limpia.includes("drive.google.com")) {

        const match =
          limpia.match(/\/d\/([^\/\?]+)/) ||
          limpia.match(/id=([^&]+)/);

        if (match && match[1]) {

          return `https://lh3.googleusercontent.com/d/${match[1]}=s1000`;
        }
      }

      return limpia;
    }


    // =========================================================
    // NORMALIZAR FECHA
    // =========================================================

    function normalizarFecha(fecha) {

      if (!fecha) return '';

      let texto = fecha.trim();

      // Elimina hora si existe
      texto = texto.split(' ')[0];

      // Formato YYYY-MM-DD
      if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(texto)) {

        const partes = texto.split('-');

        return `${partes[0]}-${partes[1].padStart(2, '0')}-${partes[2].padStart(2, '0')}`;
      }

      // Formato DD/MM/YYYY
      if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(texto)) {

        const partes = texto.split('/');

        return `${partes[2]}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`;
      }

      return texto;
    }


    // =========================================================
    // CARGAR DATOS DEL GOOGLE SHEET
    // =========================================================

    async function cargarDatos() {

      // Evita que dos consultas se ejecuten simultáneamente
      if (cargando) return;

      cargando = true;

      try {

        const hoy = new Date();

        const dia = hoy.getDate()
          .toString()
          .padStart(2, '0');

        const mes = (hoy.getMonth() + 1)
          .toString()
          .padStart(2, '0');

        const anio = hoy.getFullYear()
          .toString();

        const fechaHoy = `${anio}-${mes}-${dia}`;


        // Mostrar fecha actual

        const opcionesFecha = {
          day: 'numeric',
          month: 'long'
        };

        document.getElementById('date-title').innerText =
          hoy.toLocaleDateString('es-ES', opcionesFecha);


        // =====================================================
        // CACHE BUSTER
        // =====================================================

        const url =
          `${SHEET_URL}&cachebuster=${Date.now()}`;


        const controller = new AbortController();

        const timeoutId = setTimeout(() => {
          controller.abort();
        }, 8000);


        const res = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });


        clearTimeout(timeoutId);


        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }


        const csvTexto = await res.text();


        if (!csvTexto || csvTexto.length < 10) {
          throw new Error("El CSV está vacío");
        }


        // =====================================================
        // PROCESAR CSV
        // =====================================================

        const filas = parseCSV(csvTexto);


        if (filas.length <= 1) {
          console.warn("No hay datos suficientes en el Spreadsheet.");
          return;
        }


        // =====================================================
        // BUSCAR LA FILA DE HOY
        // =====================================================

        let filaHoy = null;


        for (let i = 1; i < filas.length; i++) {

          const fechaCelda = normalizarFecha(filas[i][0]);

          if (fechaCelda === fechaHoy) {

            filaHoy = filas[i];

            break;
          }
        }


        // Si no encuentra la fecha exacta,
        // NO seleccionamos arbitrariamente otra fila.

        if (!filaHoy) {

          console.warn(
            `No se encontró la fecha ${fechaHoy} en el Spreadsheet.`
          );

          return;
        }


        // =====================================================
        // OBTENER MENSAJE Y FOTO
        // =====================================================

        const mensaje =
          filaHoy[1]
            ? filaHoy[1].trim()
            : '';

        const fotoUrl =
          filaHoy[2]
            ? filaHoy[2].trim()
            : '';


        const urlFinal =
          arreglarUrlImagen(fotoUrl);


        // =====================================================
        // ACTUALIZAR MENSAJE SOLO SI CAMBIÓ
        // =====================================================

        if (mensaje && mensaje !== ultimoMensaje) {

          document.getElementById('daily-msg').innerText =
            `"${mensaje}"`;

          ultimoMensaje = mensaje;
        }


        // =====================================================
        // ACTUALIZAR FOTO SOLO SI CAMBIÓ
        // =====================================================

        if (urlFinal && urlFinal !== ultimaFoto) {

          const imagen =
            document.getElementById('daily-img');


          imagen.style.opacity = '0.3';


          const nuevaImagen = new Image();


          nuevaImagen.onload = function() {

            imagen.src = urlFinal;

            imagen.style.opacity = '1';

          };


          nuevaImagen.onerror = function() {

            console.warn(
              "No se pudo cargar la imagen:",
              urlFinal
            );

            imagen.style.opacity = '1';
          };


          nuevaImagen.src =
            `${urlFinal}${urlFinal.includes('?') ? '&' : '?'}cb=${Date.now()}`;


          ultimaFoto = urlFinal;
        }


        console.log(
          `Datos actualizados: ${new Date().toLocaleTimeString()}`
        );

      } catch (error) {

        console.warn(
          "No se pudieron actualizar los datos:",
          error.message
        );

      } finally {

        cargando = false;
      }
    }


    // =========================================================
    // CARGA INICIAL
    // =========================================================

    cargarDatos();


    // =========================================================
    // ACTUALIZACIÓN AUTOMÁTICA
    // =========================================================
    //
    // Consulta el Spreadsheet cada 10 segundos.
    //
    // Puedes cambiar 10000 por:
    //
    // 5000  = 5 segundos
    // 10000 = 10 segundos
    // 30000 = 30 segundos
    // 60000 = 1 minuto
    //

    setInterval(cargarDatos, 10000);

  </script>

</body>
</html>
