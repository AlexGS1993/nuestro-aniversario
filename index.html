<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodas de Lino - 4.º Aniversario</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f4f6f8;
      background-image: radial-gradient(#d0d7de 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      border: 1px solid #eef2f5;
    }
    .flower-icon { font-size: 32px; margin-bottom: 8px; }
    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7f8c8d;
      font-weight: 500;
      margin-bottom: 6px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      color: #1a252f;
      margin-bottom: 4px;
    }
    .date-display {
      font-size: 13px;
      color: #95a5a6;
      margin-bottom: 24px;
      font-style: italic;
    }
    .img-container {
      width: 100%;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      background: #f8f9fa;
      margin-bottom: 24px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }
    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .msg-box {
      background: #f8fafc;
      border-left: 3px solid #4a6fa5;
      padding: 18px 20px;
      border-radius: 0 12px 12px 0;
      text-align: left;
      margin-bottom: 28px;
    }
    .msg-box p {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #34495e;
      font-style: italic;
    }
    .footer {
      font-size: 12px;
      color: #bdc3c7;
    }
    .footer span { color: #e74c3c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="flower-icon">🪻</div>
    <div class="subtitle">Bodas de Lino & Flores</div>
    <h1>4.º Aniversario</h1>
    <div class="date-display" id="date-title">Cargando fecha...</div>

    <div class="img-container">
      <img id="daily-img" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600" alt="Nuestra foto del día">
    </div>

    <div class="msg-box">
      <p id="daily-msg">Cargando tu detalle de hoy...</p>
    </div>

    <div class="footer">
      Hecho con <span>♥️</span> para ti
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz-258MAXfAP-9ryBlUbqwAEtNTZpb8qWhR8mA4WRxDJVHlzlbYbQR2FHRWRYZgz6wfU-EhyfBJ9YH/pub?output=csv";

    async function cargarMensaje() {
      const ahora = new Date();
      const opcionesFecha = { day: 'numeric', month: 'long' };
      document.getElementById('date-title').innerText = ahora.toLocaleDateString('es-ES', opcionesFecha);

      try {
        const respuesta = await fetch(SHEET_CSV_URL + '&t=' + new Date().getTime());
        if (!respuesta.ok) throw new Error("Error de red");
        
        const texto = await respuesta.text();
        const lineas = texto.split('\n');
        
        // Separar las celdas considerando comas
        const filas = lineas.map(l => l.split(/,(?=(?:(?:[^"]"){2})[^"]*$)/));

        // Filtrar filas vacías o encabezados
        const filasValidas = filas.filter(f => f.length >= 2 && f[1] && f[1].trim() !== "" && !f[0].toLowerCase().includes("fecha"));

        if (filasValidas.length > 0) {
          // Intentar buscar la fecha de hoy (dia 27)
          let filaHoy = filasValidas.find(f => f[0].includes("27") || f[0].includes("2026-08-27"));

          // Si no la encuentra por fecha, toma la primera disponible de tu tabla (A2)
          if (!filaHoy) filaHoy = filasValidas[0];

          // Asignar Mensaje
          const mensaje = filaHoy[1].replace(/^"|"$/g, '').trim();
          document.getElementById('daily-msg').innerText = "${mensaje}";

          // Asignar Foto
          if (filaHoy[2] && filaHoy[2].trim() !== "") {
            let imgUrl = filaHoy[2].replace(/^"|"$/g, '').trim();
            
            // Convertir Drive a link directo si es necesario
            if (imgUrl.includes("drive.google.com")) {
              const match = imgUrl.match(/\/d\/([^\/\?]+)/);
              if (match) {
                imgUrl = https://lh3.googleusercontent.com/d/${match[1]};
              }
            }
            document.getElementById('daily-img').src = imgUrl;
          }
        }
      } catch (e) {
        console.log("Error:", e);
      }
    }

    cargarMensaje();
  </script>
</body>
</html>
